name: PR policy

on:
  pull_request_target:
    branches:
      - master
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    branches:
      - master
    types: [submitted, edited, dismissed]

concurrency:
  group: pr-policy-${{ github.event.pull_request.number || github.event.workflow_run.head_sha }}
  cancel-in-progress: false

permissions:
  contents: write
  checks: write
  pull-requests: write

jobs:
  policy:
    uses: h5p/h5p-ci-workflows/.github/workflows/pull-request-policy.yml@aef2c284358b47fd3d4d6895fa956f3cb748ff88
    with:
      policy-ref: aef2c284358b47fd3d4d6895fa956f3cb748ff88
      required-checks: '["ci / validate-translations", "ci / build"]'
      translation-paths: '["language/*.json"]'
      fallback-owner: makmentins
      merge-method: merge
      policy-check-name: H5P policy approval